name: Refresh dependency lockfile
on:
  push:
    branches: [feature/pocket-network-tools]
permissions:
  contents: write
jobs:
  refresh:
    if: github.repository == 'Dovshmi/DashDash'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm install --package-lock-only --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Commit lockfile update to feature branch
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already synchronized"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Synchronize npm lockfile for clean CI and deployment"
            git push origin HEAD:feature/pocket-network-tools
          fi
