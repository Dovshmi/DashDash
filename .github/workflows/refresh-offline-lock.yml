name: Refresh offline MAC dependency lockfile
on:
  push:
    branches: [fix/offline-mac-registry]
permissions:
  contents: write
jobs:
  refresh:
    if: github.repository == 'Dovshmi/DashDash'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm install --package-lock-only --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Update branch lockfile
        run: |
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Include pinned offline IEEE vendor database in npm lockfile"
            git push origin HEAD:fix/offline-mac-registry
          fi
